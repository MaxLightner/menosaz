name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check types and catalog/access migrations
        run: |
          pnpm run lint
          pnpm run test:domains
          pnpm run test:notifications
          pnpm run test:billing
          pnpm run test:customer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for optimized menu thumbnails
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Build public site
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_SITE_URL || 'https://maxlightner.github.io/menosaz' }}
        run: |
          pnpm run build
          python scripts/build-menu-tiles.py
          node scripts/fix-pages-paths.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
