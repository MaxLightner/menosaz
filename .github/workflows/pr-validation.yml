name: Pull Request Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test:domains
      - run: pnpm run test:notifications
      - run: pnpm run test:billing
      - run: pnpm run test:customer
      - run: pnpm exec tsx scripts/test-ai-menu-import.ts
      - run: pnpm exec tsx scripts/test-admin-ai-settings.ts
      - run: pnpm run build
